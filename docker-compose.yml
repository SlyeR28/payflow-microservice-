

# ==============================================================================
# PAYFLOW MASTER DOCKER COMPOSE ORCHESTRATION
# Lean Architecture (Without Caching & Resilience for Initial Deployment)
# ==============================================================================

networks:
  payflow-net:
    name: payflow-network
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  minio-data:

services:
  # ============================================================================
  # 1. INFRASTRUCTURE & STORAGE TIER
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: payflow-mysql
    restart: always
    networks:
      - payflow-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Rishabh@28}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Rishabh@28}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7.0
    container_name: payflow-mongodb
    restart: always
    networks:
      - payflow-net
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: payflow-minio
    restart: always
    networks:
      - payflow-net
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_payflow_master}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-StrongMasterSecretKey#2026Secure}
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: payflow-minio-init
    networks:
      - payflow-net
    environment:
      MC_CONFIG_DIR: /tmp
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO server to be ready...';
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin_payflow_master} ${MINIO_ROOT_PASSWORD:-StrongMasterSecretKey#2026Secure}; do
        echo 'MinIO is not ready yet, retrying in 2 seconds...';
        sleep 2;
      done;
      mc mb myminio/merchant-documents --ignore-existing;
      mc mb myminio/user-avatars --ignore-existing;
      mc anonymous set download myminio/merchant-documents;
      mc anonymous set download myminio/user-avatars;
      echo 'PayFlow buckets successfully created!';
      exit 0;
      "

  # ============================================================================
  # 2. SERVICE DISCOVERY & CONFIGURATION TIER
  # ============================================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: payflow/eureka-server:latest
    container_name: payflow-eureka-server
    restart: always
    networks:
      - payflow-net
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: payflow/config-server:latest
    container_name: payflow-config-server
    restart: always
    networks:
      - payflow-net
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ============================================================================
  # 3. CORE BUSINESS MICROSERVICES TIER
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: payflow/auth-service:latest
    container_name: payflow-auth-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  merchant-service:
    build:
      context: ./merchant-service
      dockerfile: Dockerfile
    image: payflow/merchant-service:latest
    container_name: payflow-merchant-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: payflow/payment-service:latest
    container_name: payflow-payment-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  ledger-service:
    build:
      context: ./ledger-service
      dockerfile: Dockerfile
    image: payflow/ledger-service:latest
    container_name: payflow-ledger-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: payflow/notification-service:latest
    container_name: payflow-notification-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  # ============================================================================
  # 4. EDGE INGRESS GATEWAY TIER
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: payflow/api-gateway:latest
    container_name: payflow-api-gateway
    restart: always
    networks:
      - payflow-net
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
