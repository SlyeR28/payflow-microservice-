

# ==============================================================================
# PAYFLOW MASTER DOCKER COMPOSE ORCHESTRATION
# Lean Architecture (Without Caching & Resilience for Initial Deployment)
# ==============================================================================

networks:
  payflow-net:
    name: payflow-network
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  kafka-data:

services:
  # ============================================================================
  # 1. INFRASTRUCTURE & STORAGE TIER
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: payflow-mysql
    restart: always
    networks:
      - payflow-net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Rishabh@28}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Rishabh@28}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7.0
    container_name: payflow-mongodb
    restart: always
    networks:
      - payflow-net
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. SERVICE DISCOVERY & CONFIGURATION TIER
  # ============================================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: payflow/eureka-server:latest
    container_name: payflow-eureka-server
    restart: always
    networks:
      - payflow-net
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: payflow/config-server:latest
    container_name: payflow-config-server
    restart: always
    networks:
      - payflow-net
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ============================================================================
  # 3. CORE BUSINESS MICROSERVICES TIER
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: payflow/auth-service:latest
    container_name: payflow-auth-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  merchant-service:
    build:
      context: ./merchant-service
      dockerfile: Dockerfile
    image: payflow/merchant-service:latest
    container_name: payflow-merchant-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: payflow/payment-service:latest
    container_name: payflow-payment-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  ledger-service:
    build:
      context: ./ledger-service
      dockerfile: Dockerfile
    image: payflow/ledger-service:latest
    container_name: payflow-ledger-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: payflow/notification-service:latest
    container_name: payflow-notification-service
    restart: always
    networks:
      - payflow-net
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-jaatboykumar12@gmail.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-jmlxwhdwfqigaulv}

  # ============================================================================
  # 4. EDGE INGRESS GATEWAY TIER
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: payflow/api-gateway:latest
    container_name: payflow-api-gateway
    restart: always
    networks:
      - payflow-net
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller

        KAFKA_LISTENERS: PLAINTEXT://localhost:9092 ,CONTROLLER://localhost:9093

        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

#        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
#        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
#        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
#        KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payflow-net


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "7575:8080"
    environment:
     KAFKA_CLUSTERS_0_NAME: local-kafka
     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
     DYNAMIC_CONFIG_ENABLED: "false"
    networks:
      - payflow-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - payflow-net