spring:
  application:
    name: merchant-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/merchant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Rishabh@28}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 50
    open-in-view: false


server:
  port: ${PORT:8083}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-this-must-be-at-least-64-characters-for-hs256-signing}
    expiration-millis: 900000
  refresh-token:
    expiration-millis: 604800000
  security:
    encryption-key: ${ENCRYPTION_SECRET_KEY:payflow-256-bit-aes-gcm-secret-key-32b!}

  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://192.168.1.9:9000}
      bucket-name: ${S3_BUCKET_NAME:merchant-documents}
      access-key: ${S3_ACCESS_KEY:admin_payflow_master}
      secret-key: ${S3_SECRET_KEY:StrongMasterSecretKey#2026Secure}
      region: ${S3_REGION:us-east-1}


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.payflow.merchant: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG


